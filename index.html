<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tally – student budget tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="topbar">
      <label class="field">Month
        <input type="month" id="viewMonth">
      </label>
      <label class="field">Currency
        <select id="currency">
          <option value="USD">USD – US dollar</option><option value="EUR">EUR – Euro</option>
          <option value="GBP">GBP – British pound</option><option value="INR">INR – Indian rupee</option>
          <option value="NPR">NPR – Nepali rupee</option><option value="AUD">AUD – Australian dollar</option>
          <option value="CAD">CAD – Canadian dollar</option><option value="JPY">JPY – Japanese yen</option>
          <option value="CNY">CNY – Chinese yuan</option><option value="NGN">NGN – Nigerian naira</option>
        </select>
      </label>
    </div>

    <header class="hero" aria-live="polite">
      <p class="hero-label" id="heroLabel">You can safely spend today</p>
      <p class="hero-number" id="safeToday">$0.00</p>
      <p class="hero-sub" id="heroSub"></p>
      <div class="meter" role="progressbar" aria-label="Share of monthly budget spent" aria-valuemin="0" aria-valuemax="100" id="meter">
        <span id="meterFill"></span>
      </div>
    </header>

    <section class="panel" aria-labelledby="budgetTitle">
      <h2 id="budgetTitle">Monthly budget</h2>
      <div class="row">
        <label class="field grow">Budget amount
          <input type="number" id="budgetInput" min="0" step="0.01" placeholder="e.g. 400">
        </label>
        <button type="button" id="saveBudget">Save budget</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="addTitle">
      <h2 id="addTitle">Add an expense</h2>
      <form id="expenseForm" class="grid">
        <label class="field">Amount
          <input type="number" id="amount" min="0.01" step="0.01" required placeholder="0.00">
        </label>
        <label class="field">Category
          <select id="category">
            <option>Food</option><option>Transport</option><option>Books</option>
            <option>Rent &amp; bills</option><option>Fun</option><option>Other</option>
          </select>
        </label>
        <label class="field">Date
          <input type="date" id="date" required>
        </label>
        <label class="field">Note (optional)
          <input type="text" id="note" maxlength="60" placeholder="Lunch with friends">
        </label>
        <button type="submit" class="wide">Add expense</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="chartTitle">
      <h2 id="chartTitle">Where it went</h2>
      <div class="chart-wrap"><canvas id="chart" aria-label="Spending by category" role="img"></canvas></div>
      <p class="empty" id="chartEmpty">Add your first expense to see the breakdown.</p>
    </section>

    <section class="panel" aria-labelledby="listTitle">
      <div class="row">
        <h2 id="listTitle" class="grow">This month’s expenses</h2>
        <button type="button" class="ghost" id="exportBtn">Download CSV</button>
      </div>
      <ul id="list"></ul>
      <p class="empty" id="listEmpty">Nothing yet. Add an expense above.</p>
    </section>

    <section class="panel" aria-labelledby="monthsTitle">
      <h2 id="monthsTitle">All months</h2>
      <ul id="months" class="months"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
